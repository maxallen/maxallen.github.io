<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog - Max Allen</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #ffffff;
      min-height: 100vh;
      color: #333;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      z-index: 100;
      border-bottom: 1px solid #e5e5e5;
    }

    .logo {
      width: 60px;
      height: 60px;
    }

    nav a {
      color: #333;
      text-decoration: none;
      margin-left: 30px;
      font-size: 16px;
      transition: opacity 0.3s;
    }

    nav a:hover {
      opacity: 0.7;
    }

    nav a.active {
      font-weight: 600;
    }

    main {
      margin-top: 100px;
      display: flex;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
      padding: 40px 20px;
      gap: 40px;
    }

    .sidebar {
      width: 300px;
      flex-shrink: 0;
    }

    .sidebar h2 {
      font-size: 20px;
      margin-bottom: 20px;
      color: #000;
    }

    .post-list {
      list-style: none;
    }

    .post-list li {
      margin-bottom: 16px;
    }

    .post-list a {
      color: #333;
      text-decoration: none;
      font-size: 16px;
      display: block;
      padding: 12px 16px;
      border-radius: 8px;
      transition: background-color 0.2s;
    }

    .post-list a:hover {
      background-color: #f5f5f5;
    }

    .post-list a.active {
      background-color: #f0f0f0;
      font-weight: 500;
    }

    .content {
      flex: 1;
      min-width: 0;
    }

    .blog-post {
      background: #ffffff;
      padding: 40px;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      line-height: 1.6;
    }

    .blog-post h1 {
      font-size: 36px;
      margin-bottom: 24px;
      color: #000;
      font-weight: 700;
    }

    .blog-post h2 {
      font-size: 28px;
      margin-top: 32px;
      margin-bottom: 16px;
      color: #000;
      font-weight: 600;
    }

    .blog-post h3 {
      font-size: 22px;
      margin-top: 24px;
      margin-bottom: 12px;
      color: #000;
      font-weight: 600;
    }

    .blog-post p {
      margin-bottom: 16px;
      font-size: 16px;
      color: #333;
    }

    .blog-post code {
      background-color: #f5f5f5;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
      font-size: 14px;
    }

    .blog-post pre {
      background-color: #f5f5f5;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin-bottom: 16px;
    }

    .blog-post pre code {
      background: none;
      padding: 0;
      border-radius: 0;
      display: block;
    }

    .blog-post ul, .blog-post ol {
      margin-bottom: 16px;
      padding-left: 24px;
    }

    .blog-post li {
      margin-bottom: 8px;
    }

    .blog-post blockquote {
      border-left: 4px solid #e5e5e5;
      padding-left: 16px;
      margin: 16px 0;
      color: #666;
      font-style: italic;
    }

    .blog-post a {
      color: #0066cc;
      text-decoration: none;
    }

    .blog-post a:hover {
      text-decoration: underline;
    }

    .placeholder {
      text-align: center;
      padding: 60px;
      color: #666;
    }

    @media (max-width: 768px) {
      header {
        padding: 15px 20px;
      }

      .logo {
        width: 50px;
        height: 50px;
      }

      nav a {
        margin-left: 20px;
        font-size: 14px;
      }

      main {
        flex-direction: column;
        margin-top: 80px;
        padding: 20px;
      }

      .sidebar {
        width: 100%;
      }

      .blog-post {
        padding: 24px;
      }

      .blog-post h1 {
        font-size: 28px;
      }

      .blog-post h2 {
        font-size: 24px;
      }

      .blog-post h3 {
        font-size: 20px;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
  <header>
    <a href="index.html">
      <img src="./assets/images/MGA.svg" alt="Max Allen" class="logo">
    </a>
    <nav>
      <a href="about.html">About</a>
      <a href="blog.html" class="active">Blog</a>
    </nav>
  </header>

  <main>
    <aside class="sidebar">
      <h2>Posts</h2>
      <ul class="post-list" id="post-list">
        <!-- Posts will be loaded here -->
      </ul>
    </aside>

    <div class="content">
      <div class="blog-post" id="blog-content">
        <div class="placeholder">
          <p>Select a post from the sidebar to start reading.</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Available blog posts
    const posts = [
      { title: 'Getting Started with Modern JavaScript', file: 'post1.md' },
      { title: 'Building a Responsive Web Design System', file: 'post2.md' }
    ];

    // Initialize
    const postList = document.getElementById('post-list');
    const blogContent = document.getElementById('blog-content');
    let currentPost = null;

    // Render post list
    posts.forEach((post, index) => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#';
      a.textContent = post.title;
      a.dataset.file = post.file;
      a.onclick = (e) => {
        e.preventDefault();
        loadPost(post.file, a);
      };
      li.appendChild(a);
      postList.appendChild(li);
    });

    // Load a post
    async function loadPost(filename, linkElement) {
      try {
        // Update active state
        document.querySelectorAll('.post-list a').forEach(link => {
          link.classList.remove('active');
        });
        linkElement.classList.add('active');

        // Fetch and render the markdown
        const response = await fetch(`./blog/posts/${filename}`);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const markdown = await response.text();
        
        // Configure marked options for Notion-like rendering
        marked.setOptions({
          breaks: true,
          gfm: true,
          headerIds: false,
          mangle: false
        });

        const html = marked.parse(markdown);
        blogContent.innerHTML = html;
        
        currentPost = filename;
      } catch (error) {
        console.error('Error loading post:', error);
        blogContent.innerHTML = `
          <div class="blog-post">
            <p style="color: #cc0000;">Error loading post: ${error.message}</p>
            <p style="color: #666; margin-top: 10px;">Note: If you're viewing this file locally (file:// protocol), the blog posts won't load due to CORS restrictions. Please either:</p>
            <ul style="color: #666;">
              <li>Use a local web server (e.g., <code>python3 -m http.server</code>)</li>
              <li>Deploy to GitHub Pages</li>
              <li>Open in a web server environment</li>
            </ul>
          </div>
        `;
      }
    }

    // Load first post by default
    if (posts.length > 0) {
      const firstLink = postList.querySelector('a');
      if (firstLink) {
        loadPost(posts[0].file, firstLink);
      }
    }
  </script>
</body>

</html>
