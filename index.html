<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Max Allen - Personal Website</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #ffffff;
      overflow: hidden;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      z-index: 100;
      border-bottom: 1px solid #e5e5e5;
    }

    .logo {
      width: 60px;
      height: 60px;
    }

    nav a {
      color: #333;
      text-decoration: none;
      margin-left: 30px;
      font-size: 16px;
      transition: opacity 0.3s;
    }

    nav a:hover {
      opacity: 0.7;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
    }
  </style>
</head>

<body>
  <header>
    <img src="./assets/images/MGA.svg" alt="Max Allen" class="logo">
    <nav>
      <a href="about.html">About</a>
      <a href="blog.html">Blog</a>
    </nav>
  </header>

  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 7;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Create lesser stellated dodecahedron
    const phi = (1 + Math.sqrt(5)) / 2;
    const invPhi = 1 / phi;

    // Vertices for stellated dodecahedron
    const vertices = [
      // Dodecahedron vertices
      new THREE.Vector3(1, 1, 1),
      new THREE.Vector3(1, 1, -1),
      new THREE.Vector3(1, -1, 1),
      new THREE.Vector3(1, -1, -1),
      new THREE.Vector3(-1, 1, 1),
      new THREE.Vector3(-1, 1, -1),
      new THREE.Vector3(-1, -1, 1),
      new THREE.Vector3(-1, -1, -1),
      new THREE.Vector3(0, phi, invPhi),
      new THREE.Vector3(0, phi, -invPhi),
      new THREE.Vector3(0, -phi, invPhi),
      new THREE.Vector3(0, -phi, -invPhi),
      new THREE.Vector3(invPhi, 0, phi),
      new THREE.Vector3(invPhi, 0, -phi),
      new THREE.Vector3(-invPhi, 0, phi),
      new THREE.Vector3(-invPhi, 0, -phi),
      new THREE.Vector3(phi, invPhi, 0),
      new THREE.Vector3(phi, -invPhi, 0),
      new THREE.Vector3(-phi, invPhi, 0),
      new THREE.Vector3(-phi, -invPhi, 0)
    ];

    // Create geometry
    const geometry = new THREE.BufferGeometry();
    const positions = [];
    
    // Define pentagram faces for the stellated dodecahedron
    const faces = [
      [0, 8, 9, 1, 16], [0, 16, 17, 2, 12], [0, 12, 14, 4, 8],
      [1, 9, 5, 15, 13], [1, 13, 3, 17, 16], [2, 17, 3, 11, 10],
      [2, 10, 6, 14, 12], [3, 13, 15, 7, 11], [4, 14, 6, 19, 18],
      [4, 18, 5, 9, 8], [5, 18, 19, 7, 15], [6, 10, 11, 7, 19]
    ];

    // Create star-shaped faces
    faces.forEach(face => {
      const center = new THREE.Vector3();
      face.forEach(idx => {
        center.add(vertices[idx]);
      });
      center.divideScalar(face.length);

      // Extend center point outward to create stellations
      const extendedCenter = center.clone().multiplyScalar(1.8);

      // Create triangular faces from pentagram
      for (let i = 0; i < face.length; i++) {
        const v1 = vertices[face[i]];
        const v2 = vertices[face[(i + 1) % face.length]];
        
        // Inner triangle
        positions.push(center.x, center.y, center.z);
        positions.push(v1.x, v1.y, v1.z);
        positions.push(v2.x, v2.y, v2.z);
        
        // Outer stellated triangle
        positions.push(extendedCenter.x, extendedCenter.y, extendedCenter.z);
        positions.push(v2.x, v2.y, v2.z);
        positions.push(v1.x, v1.y, v1.z);
      }
    });

    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.computeVertexNormals();

    // Create a more pronounced texture
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    
    // Create a brushed metal texture
    ctx.fillStyle = '#808080';
    ctx.fillRect(0, 0, 512, 512);
    
    // Add directional scratches/brushed effect
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 512; i += 2) {
      ctx.beginPath();
      ctx.moveTo(0, i + Math.random() * 2);
      ctx.lineTo(512, i + Math.random() * 2);
      ctx.stroke();
    }
    
    // Add darker scratches
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
    for (let i = 0; i < 512; i += 3) {
      ctx.beginPath();
      ctx.moveTo(0, i + Math.random() * 3);
      ctx.lineTo(512, i + Math.random() * 3);
      ctx.stroke();
    }
    
    // Add some spots and imperfections
    for (let i = 0; i < 50; i++) {
      const x = Math.random() * 512;
      const y = Math.random() * 512;
      const radius = Math.random() * 3 + 1;
      const opacity = Math.random() * 0.2;
      ctx.fillStyle = `rgba(0, 0, 0, ${opacity})`;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
    }
    
    const texture = new THREE.CanvasTexture(canvas);
    texture.needsUpdate = true;

    // Create normal map for depth
    const normalCanvas = document.createElement('canvas');
    normalCanvas.width = 512;
    normalCanvas.height = 512;
    const normalCtx = normalCanvas.getContext('2d');
    
    // Generate normal map from height variations
    normalCtx.fillStyle = '#8080ff';
    normalCtx.fillRect(0, 0, 512, 512);
    
    // Add variations to normal map
    for (let i = 0; i < 100; i++) {
      const x = Math.random() * 512;
      const y = Math.random() * 512;
      const size = Math.random() * 20 + 5;
      const gradient = normalCtx.createRadialGradient(x, y, 0, x, y, size);
      gradient.addColorStop(0, '#a0a0ff');
      gradient.addColorStop(1, '#8080ff');
      normalCtx.fillStyle = gradient;
      normalCtx.fillRect(x - size, y - size, size * 2, size * 2);
    }
    
    const normalMap = new THREE.CanvasTexture(normalCanvas);
    normalMap.needsUpdate = true;

    // Material with enhanced properties
    const material = new THREE.MeshStandardMaterial({
      color: 0x909090,
      map: texture,
      normalMap: normalMap,
      normalScale: new THREE.Vector2(0.5, 0.5),
      metalness: 0.7,
      roughness: 0.3,
      flatShading: true,
      side: THREE.DoubleSide
    });

    // Create mesh
    const stellatedDodecahedron = new THREE.Mesh(geometry, material);
    scene.add(stellatedDodecahedron);

    // Enhanced lighting for better texture visibility
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight1.position.set(1, 1, 0.5);
    scene.add(directionalLight1);
    
    const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
    directionalLight2.position.set(-1, -0.5, -1);
    scene.add(directionalLight2);
    
    // Add a point light for highlights
    const pointLight = new THREE.PointLight(0xffffff, 0.5);
    pointLight.position.set(0, 2, 2);
    scene.add(pointLight);

    // Mouse interaction variables
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let autoRotate = true;

    // Mouse event handlers
    renderer.domElement.addEventListener('mousedown', (e) => {
      isDragging = true;
      previousMousePosition = { x: e.clientX, y: e.clientY };
      autoRotate = false;
    });

    renderer.domElement.addEventListener('mousemove', (e) => {
      if (!isDragging) return;

      const deltaMove = {
        x: e.clientX - previousMousePosition.x,
        y: e.clientY - previousMousePosition.y
      };

      stellatedDodecahedron.rotation.y += deltaMove.x * 0.005;
      stellatedDodecahedron.rotation.x += deltaMove.y * 0.005;

      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener('mouseup', () => {
      isDragging = false;
      autoRotate = true;
    });

    renderer.domElement.addEventListener('mouseleave', () => {
      isDragging = false;
    });

    // Touch event handlers for mobile
    renderer.domElement.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        autoRotate = false;
      }
    });

    renderer.domElement.addEventListener('touchmove', (e) => {
      if (!isDragging || e.touches.length !== 1) return;

      const deltaMove = {
        x: e.touches[0].clientX - previousMousePosition.x,
        y: e.touches[0].clientY - previousMousePosition.y
      };

      stellatedDodecahedron.rotation.y += deltaMove.x * 0.005;
      stellatedDodecahedron.rotation.x += deltaMove.y * 0.005;

      previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    });

    renderer.domElement.addEventListener('touchend', () => {
      isDragging = false;
      autoRotate = true;
    });

    // Animation
    function animate() {
      requestAnimationFrame(animate);
      
      // Auto-rotate when not dragging
      if (autoRotate) {
        stellatedDodecahedron.rotation.x += 0.003;
        stellatedDodecahedron.rotation.y += 0.005;
      }
      
      renderer.render(scene, camera);
    }

    // Handle window resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });


    animate();
  </script>
</body>

</html>
